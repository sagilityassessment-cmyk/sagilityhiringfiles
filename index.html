<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAGILITY FILES LOGIN</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?q=80&w=1920') center center/cover no-repeat;
}

.login-box{
    width:700px;
    padding:70px;
    border-radius:20px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    -webkit-backdrop-filter:blur(15px);
    box-shadow:0 8px 32px rgba(0,0,0,.2);
}

h1{
    text-align:center;
    font-size:60px;
    font-weight:900;
    margin-bottom:60px;
    color:#000;
    text-transform:uppercase;
}

.input-group{
    position:relative;
    margin-bottom:30px;
}

.input-group input{
    width:100%;
    padding:18px 50px 18px 0;
    border:none;
    border-bottom:2px solid rgba(0,0,0,.3);
    outline:none;
    background:transparent;
    font-size:24px;
    color:#111;
}

.toggle-password{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:24px;
}

.remember{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:30px;
    font-size:18px;
}

button{
    width:100%;
    padding:20px;
    border:none;
    border-radius:10px;
    background:#009688;
    color:#fff;
    font-size:28px;
    font-weight:700;
    cursor:pointer;
}

button:hover{
    background:#00796B;
}

.creator{
    text-align:center;
    margin-top:20px;
    font-size:25px;
}
</style>
</head>

<body>

<div class="login-box">

    <h1>SAGILITY FILES</h1>

    <div class="input-group">
        <input type="text" id="username" placeholder="Username">
    </div>

    <div class="input-group">
        <input type="password" id="password" placeholder="Password">
        <span class="toggle-password" onclick="togglePassword()">👁</span>
    </div>

    <div class="remember">
        <input type="checkbox">
        <span>Remember Me</span>
    </div>

    <button type="button" onclick="login()">Login</button>

    <div class="creator">
        Created by Richiel Caña
    </div>

</div>

<script>

function togglePassword() {

    const passwordField = document.getElementById("password");

    if (passwordField.type === "password") {
        passwordField.type = "text";
    } else {
        passwordField.type = "password";
    }

}

function login() {

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    const users = {
        "Richiel.Cana": "Sagility_2026",
        "Shaine.Maigue": "Sagility_2026",
        "Lea.Susaya": "Sagility_2026",
        "Alondra.Rivares": "Sagility_2026"
    };

    if (users[username] === password) {

        sessionStorage.setItem("loggedIn", "true");

        window.location.replace("home.html");

    } else {

        alert("Invalid Username or Password");

    }

}

</script>
</body>
</html>
